name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
      - run: npm install --no-audit --no-fund
      - run: npx tauri icon app-icon.png
      - name: Build executable
        run: npx tauri build --no-bundle
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Netron Plus $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" target/release/netron-plus.exe --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: netron-plus-windows
          path: target/release/netron-plus.exe
          if-no-files-found: error
