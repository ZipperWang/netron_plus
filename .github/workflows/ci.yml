name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  samples:
    name: Sample models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-samples.txt
      - name: Install generators
        run: pip install -r scripts/requirements-samples.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Generate models
        run: |
          python scripts/gen_samples.py --out samples
          python scripts/gen_torch_samples.py --out samples
          ls -la samples
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: samples
          retention-days: 30

  core:
    name: Core tests
    needs: samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
      - uses: actions/download-artifact@v4
        with:
          name: samples
          path: samples
      - name: Test
        run: cargo test -p netron-core --release -- --nocapture
        env:
          NETRON_SAMPLES: ${{ github.workspace }}/samples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-lock
          path: Cargo.lock

  web:
    name: Web build (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - name: Build the WebAssembly core
        run: |
          cargo build -p netron-wasm --release --target wasm32-unknown-unknown
          mkdir -p public
          cp target/wasm32-unknown-unknown/release/netron_wasm.wasm public/netron_core.wasm
          ls -la public
      - name: Install npm packages
        run: npm install --no-audit --no-fund
      - name: Type check and bundle
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-lock
          path: package-lock.json

  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
      - name: Install npm packages
        run: npm install --no-audit --no-fund
      - name: Generate icons
        run: npx tauri icon app-icon.png
      - name: Build executable
        run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: netron-plus-windows
          path: target/release/netron-plus.exe
          if-no-files-found: error
